spring:
  application:
    name: image-intelligence-api

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

huggingface:
  api:
    url: ${HUGGINGFACE_API_URL}
    token: ${HUGGINGFACE_API_TOKEN}

server:
  port: 8080

logging:
  level:
    com.elaine.imageintelligenceapi: INFO